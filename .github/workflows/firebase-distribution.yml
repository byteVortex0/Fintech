name: Build & Deploy to Firebase Distribution

on:
  push:
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-path: "${{ runner.tool_cache }}/flutter"

      - name: Fetch dependencies
        run: flutter pub get

      - name: Generate necessary code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          appId: ${{ secrets.FIREBASE_APP_ID }}
          file: build/app/outputs/apk/release/app-arm64-v8a-release.apk
          releaseNotes: |
            New build from develop branch
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          groups: testers

      - name: Build Summary
        run: |
          echo "✅ APK built successfully!"
          echo "📦 APK: build/app/outputs/apk/release/app-arm64-v8a-release.apk"
          echo "📤 Uploaded to Firebase Distribution"
          echo "👥 Testers will receive notification"
